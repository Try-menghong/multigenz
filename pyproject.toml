[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "multigenz"
version = "0.1.0"
description = "Local-first autonomous multi-agent software-development orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "textual>=0.60",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "fastapi>=0.110",
  "httpx>=0.27",
  "litellm>=1.40",
]

[project.scripts]
multigenz = "multigenz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multigenz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["fixtures", ".git", ".venv", "dist", "build", "*.egg-info"]
addopts = "-ra"
markers = [
  "acceptance: AT-01..AT-16 from docs/IMPLEMENTATION_PLAN.md",
  "e2e: end-to-end scenarios A-C",
  "needs_userns: requires unprivileged user namespaces (userns sandbox backend)",
  "cli_agents: drives real coding-agent CLIs (opencode, cline, codex) against a local mock model; skipped if absent",
]
