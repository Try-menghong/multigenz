version: 1
orchestrator:
  mode: autonomous
  max_parallel_agents: 3
  max_task_attempts: 2
  task_timeout_seconds: 900
  run_budget_usd: 5.00
agents:
  claude:
    enabled: true
    adapter: cli
    command: claude
    capabilities: [architecture, coding, review]
  codex:
    enabled: true
    adapter: cli
    command: codex
    capabilities: [coding, testing, review]
    # No flags are ever assumed. Until you define a non-interactive invocation that is verified against the
    # binary's own help output, this adapter stays disabled (see `multigenz agents list`):
    # invocations:
    #   - name: exec
    #     argv: ["{command}", "<flags from `codex --help`>"]
    #     stdin: prompt
    #     requires_help_tokens: ["<every flag/subcommand used above>"]
  antigravity:
    enabled: true
    adapter: cli
    command: agy
    capabilities: [research, architecture]
  deepseek:
    enabled: true
    adapter: litellm
    model: deepseek/deepseek-chat
    capabilities: [analysis, review]
execution:
  isolation: rootless-container
  network: restricted
  # Required by `rootless-container`; `restricted` also needs an administrator-defined egress-limited network:
  # container_image: registry.example/multigenz-agent:1
  # container_network: multigenz-egress
git:
  auto_integrate: true
  auto_push: false
  protect_default_branch: true
validation:
  require_tests: true
  require_policy_check: true
  require_diff_review: true
  # Administrator-defined test profiles. These fixed argv lists are the ONLY commands the orchestrator ever runs to
  # verify results; acceptance_commands suggested by a planner are never executed. Without a profile and with
  # require_tests: true, no agent result can be accepted.
  # default_profile: pytest
  # integration_profile: pytest
  # profiles:
  #   pytest:
  #     commands:
  #       - argv: ["/usr/bin/python3", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
  #         timeout_seconds: 600
  #     readonly_paths: []      # extra host paths (e.g. a virtualenv) mounted read-only for the test run
